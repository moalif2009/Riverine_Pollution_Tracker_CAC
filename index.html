<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Riverine Pollution Tracker</title>

  <!-- Leaflet Map Styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>Riverine Pollution Tracker</h1>
    <ul class="legend" aria-label="Map legend">
      <li><span class="dot dot-reported"></span>Reported</li>
      <li><span class="dot dot-sent"></span>Sent to agency</li>
      <li><span class="dot dot-resolved"></span>Resolved</li>
    </ul>
  </header>

  <main class="app">
    <div id="map"></div>

    <button id="locateBtn" class="map-btn" type="button" title="Use my location" aria-label="Use my location">
      ◎
    </button>

    <button id="reportBtn" class="report-btn" type="button">Report pollution</button>

    <!-- Bottom sheet (phones) / side panel (desktop) -->
    <aside id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
      <div class="sheet-header">
        <h2 id="sheetTitle">New report</h2>
        <button id="closeSheetBtn" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>

      <!-- New report form -->
      <section id="report-form">
        <div class="field">
          <span class="field-label">1. Photo</span>
          <label class="photo-picker" id="photoPicker">
            <img id="photoPreview" alt="" hidden />
            <span id="photoPickerText">Take or choose a photo</span>
            <input type="file" id="photoInput" accept="image/*" class="visually-hidden" />
          </label>
        </div>

        <div class="field">
          <span class="field-label">2. Location</span>
          <p id="locStatus" class="loc-status">Tap the map to place the pin.</p>
          <button id="useLocationBtn" class="secondary-btn" type="button">Use my location</button>
        </div>

        <div class="field">
          <label class="field-label" for="pollutionCategory">3. Pollution type</label>
          <select id="pollutionCategory">
            <option value="Plastic Waste">Plastic / Solid Waste</option>
            <option value="Chemical / Discoloration">Chemical Spill / Discoloration</option>
            <option value="Illegal Dumping">Illegal Dumping / Debris</option>
            <option value="Sewage / Runoff">Sewage / Urban Runoff</option>
          </select>
        </div>

        <div class="action-row">
          <button id="cancelBtn" class="secondary-btn" type="button">Cancel</button>
          <button id="confirmBtn" class="primary-btn" type="button" disabled>Submit report</button>
        </div>
      </section>

      <!-- Take action (shown after a report is saved) -->
      <section id="action-section" hidden>
        <p class="sheet-intro">Report saved. Send it to someone who can act on it.</p>

        <button class="primary-btn block" type="button" onclick="sendToRiverkeeper()">Email Chattahoochee Riverkeeper</button>
        <button class="primary-btn block" type="button" onclick="sendTo311()">Report to ATL311</button>
        <a href="tel:18002414113" onclick="markSent('Georgia EPD')" class="danger-btn block">
          Spill or fish kill? Call GA EPD 24/7: (800) 241-4113
        </a>

        <button id="doneBtn" class="secondary-btn block" type="button">Done</button>
      </section>
    </aside>
  </main>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <!-- Main App Logic Script -->
  <script src="app.js"></script>

</body>
</html>
