<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4f66" />
  <title>Riverine Pollution Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" />
  <!-- Leaflet Map Styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- All visible text comes from text.js (data-text="key") -->

  <!-- Icons (use with <svg class="icon"><use href="#i-name"/></svg>) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M2 8.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4-2 6 0M2 13c2.5-2 4.5-2 7 0s4.5 2 7 0 4-2 6 0M2 17.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4-2 6 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M3 21h18M4 10h16M12 3l8 5H4zM6.5 10v8M10.5 10v8M13.5 10v8M17.5 10v8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M21 16.5v3a2 2 0 0 1-2.2 2A19.5 19.5 0 0 1 2.5 5.2 2 2 0 0 1 4.5 3h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.4 10.9a16 16 0 0 0 4.7 4.7l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 6.5v7M12 17.5v.01"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
      <div>
        <h1 data-text="appName"></h1>
        <p class="brand-tagline" data-text="appTagline"></p>
      </div>
    </div>
    <div id="modBar" class="mod-bar" hidden>
      <span data-text="modSignedIn"></span>
      <button id="signOutBtn" class="link-btn" type="button" data-text="modSignOut"></button>
    </div>
    <ul class="legend" aria-label="Map legend">
      <li><span class="badge badge-reported"><svg class="icon"><use href="#i-alert"/></svg></span><span data-text="legendReported"></span></li>
      <li><span class="badge badge-sent"><svg class="icon"><use href="#i-send"/></svg></span><span data-text="legendSent"></span></li>
      <li><span class="badge badge-resolved"><svg class="icon"><use href="#i-check"/></svg></span><span data-text="legendResolved"></span></li>
    </ul>
  </header>

  <main class="app">
    <div id="map"></div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Moved into the map's controls by app.js -->
    <button id="locateBtn" class="locate-btn" type="button" data-label="locateBtn">
      <svg class="icon"><use href="#i-locate"/></svg>
    </button>

    <button id="reportBtn" class="report-btn" type="button">
      <svg class="icon"><use href="#i-plus"/></svg>
      <span data-text="reportBtn"></span>
    </button>

    <!-- Bottom sheet (phones) / side panel (desktop) -->
    <aside id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
      <div class="sheet-header">
        <h2 id="sheetTitle"></h2>
        <button id="closeSheetBtn" class="icon-btn" type="button" data-label="close">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <!-- New report form -->
      <section id="report-form" class="sheet-body">
        <div class="field">
          <span class="field-label"><span class="step">1</span><span data-text="photoLabel"></span></span>
          <label class="photo-picker">
            <span class="photo-thumb">
              <img id="photoPreview" alt="" hidden />
              <svg class="icon"><use href="#i-camera"/></svg>
            </span>
            <span id="photoPickerText" data-text="photoPick"></span>
            <input type="file" id="photoInput" accept="image/*" class="visually-hidden" />
          </label>
        </div>

        <div class="field">
          <span class="field-label"><span class="step">2</span><span data-text="locationLabel"></span></span>
          <p id="locStatus" class="loc-status" role="status"></p>
          <button id="useLocationBtn" class="secondary-btn with-icon" type="button">
            <svg class="icon"><use href="#i-locate"/></svg>
            <span data-text="locateBtn"></span>
          </button>
        </div>

        <div class="field">
          <label class="field-label" for="pollutionCategory"><span class="step">3</span><span data-text="categoryLabel"></span></label>
          <select id="pollutionCategory" required></select>
        </div>

        <div class="field">
          <label class="field-label" for="pollutionSize"><span class="step">4</span><span data-text="sizeLabel"></span></label>
          <p class="field-hint" data-text="sizeHint"></p>
          <select id="pollutionSize" required></select>
        </div>

        <div class="action-row form-footer">
          <button id="cancelBtn" class="secondary-btn" type="button" data-text="cancel"></button>
          <button id="confirmBtn" class="primary-btn" type="button" disabled data-text="submit"></button>
        </div>
      </section>

      <!-- Take action (after saving, or from any pin) -->
      <section id="action-section" class="sheet-body" hidden>
        <p id="actionIntro" class="sheet-intro"></p>
        <div class="action-report">
          <p id="actionSummary" class="action-summary"></p>
          <p id="actionSentTo" class="action-sent-to" hidden></p>
        </div>

        <div class="agency-list" id="agencyList">
          <button id="riverkeeperBtn" data-agency="riverkeeper" class="agency" type="button">
            <span class="agency-icon"><svg class="icon"><use href="#i-mail"/></svg></span>
            <span class="agency-text">
              <span class="agency-tag" data-text="recommended" hidden></span>
              <strong data-text="riverkeeperBtn"></strong>
              <span data-text="riverkeeperNote"></span>
            </span>
            <svg class="icon agency-chevron"><use href="#i-chevron"/></svg>
          </button>
          <button id="atl311Btn" data-agency="atl311" class="agency" type="button">
            <span class="agency-icon"><svg class="icon"><use href="#i-building"/></svg></span>
            <span class="agency-text">
              <span class="agency-tag" data-text="recommended" hidden></span>
              <strong data-text="atl311Btn"></strong>
              <span data-text="atl311Note"></span>
            </span>
            <svg class="icon agency-chevron"><use href="#i-chevron"/></svg>
          </button>
          <a id="epdBtn" data-agency="epd" href="tel:18002414113" class="agency agency-urgent">
            <span class="agency-icon"><svg class="icon"><use href="#i-phone"/></svg></span>
            <span class="agency-text">
              <span class="agency-tag" data-text="recommended" hidden></span>
              <strong data-text="epdBtn"></strong>
              <span data-text="epdNote"></span>
            </span>
            <svg class="icon agency-chevron"><use href="#i-chevron"/></svg>
          </a>
        </div>

        <button id="doneBtn" class="secondary-btn block" type="button" data-text="done"></button>
      </section>
    </aside>
  </main>

  <!-- In-app dialog (replaces alert/prompt/confirm) -->
  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialogForm">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <textarea id="dialogText" rows="6" readonly hidden></textarea>
      <p id="dialogError" class="dialog-error" hidden></p>
      <div class="action-row">
        <button id="dialogCancel" class="secondary-btn" type="button"></button>
        <button id="dialogConfirm" class="primary-btn" type="submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <!-- App text, then main app logic -->
  <script src="text.js"></script>
  <script src="app.js"></script>

</body>
</html>
