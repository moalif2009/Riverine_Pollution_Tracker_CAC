<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riverine Pollution Tracker</title>

  <!-- Leaflet Map Styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrap">
    <h1>Riverine Pollution Tracker</h1>
    <p class="subtitle">Upload a photo, pick your exact location, and confirm.</p>

    <!-- STEP 1: HOME PAGE (IMAGE INPUT) -->
    <div id="upload-section">
      <div class="upload-card">
        <label class="upload-btn">
          📷 Select / Take Photo
          <input type="file" id="photoInput" accept="image/*" style="display: none;" />
        </label>
      </div>
    </div>

    <!-- STEP 2: MAP PLACEMENT VIEW -->
    <div id="map-section">
      <div class="instruction-bar" id="instruction">
        👇 Click anywhere on the map to place your pin.
      </div>

      <!-- Pollution Category Selector -->
      <div style="margin-bottom: 10px; text-align: left;">
        <label style="font-size: 0.85rem; color: #8b949e; display: block; margin-bottom: 4px;">Pollution Type:</label>
        <select id="pollutionCategory" style="width: 100%; padding: 10px; border-radius: 6px; background: #161b22; color: #e6edf3; border: 1px solid #30363d;">
          <option value="Plastic Waste">🗑️ Plastic / Solid Waste</option>
          <option value="Chemical / Discoloration">🧪 Chemical Spill / Discoloration</option>
          <option value="Illegal Dumping">🛢️ Illegal Dumping / Debris</option>
          <option value="Sewage / Runoff">🌊 Sewage / Urban Runoff</option>
        </select>
      </div>

      <div id="map"></div>

      <div class="action-row">
        <button class="reset-btn" onclick="resetApp()">← Cancel</button>
        <button id="confirmBtn" class="primary-btn" onclick="confirmLocation()">Confirm Location ✅</button>
      </div>
    </div>

    <!-- STEP 3: TAKE ACTION (shown after a report is saved) -->
    <div id="action-section" style="display: none;">
      <h2>✅ Report saved. Now get it fixed.</h2>
      <p class="subtitle">Send your report to someone who can act on it.</p>

      <button class="primary-btn" style="display: block; width: 100%; margin-bottom: 10px;"
              onclick="sendToRiverkeeper()">📧 Email Chattahoochee Riverkeeper</button>

      <button class="primary-btn" style="display: block; width: 100%; margin-bottom: 10px;"
              onclick="sendTo311()">🏙️ Report to ATL311</button>

      <a href="tel:18002414113" onclick="markSent('Georgia EPD')"
         class="delete-btn" style="display: block; padding: 12px; text-decoration: none; margin-top: 0;">
        🚨 Spill or fish kill? Call GA EPD 24/7: (800) 241-4113
      </a>

      <button class="reset-btn" style="width: 100%; margin-top: 16px;" onclick="resetApp()">Done</button>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <!-- Main App Logic Script -->
  <script src="app.js"></script>

</body>
</html>
