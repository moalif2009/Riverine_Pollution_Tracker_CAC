<!DOCTYPE html>
<html>
<head>
  <!-- 1. Leaflet CSS goes inside <head> -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Map container MUST have a defined height or it will be invisible */
    #map { height: 300px; width: 100%; }
  </style>
</head>
<body>

  <!-- 2. HTML map container -->
  <div id="map"></div>

  <!-- 3. Leaflet JS Library goes near the bottom of <body> -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 4. Your custom script that creates the map -->
  <script>
    // Initialize map on latitude/longitude (London in this example)
    const map = L.map('map').setView([51.505, -0.09], 13);

    // Load OpenStreetMap imagery tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Add a pin marker with a popup
    L.marker([51.505, -0.09]).addTo(map).bindPopup('Hello World!');
  </script>

</body>
</html>
